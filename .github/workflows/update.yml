name: Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: cachix/install-nix-action@v31.10.6
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A new nixpkgs can bring a new Maven, which changes the Maven hashes.
      - name: Refresh Maven hashes
        if: steps.update.outputs.changed == 'true'
        run: nix run .#update-hashes

      - name: Build AutoFirma through the module
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      - name: Push the update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update flake.lock and Maven hashes"
          git push
